server:
  port: your-application-port

spring:
  datasource:
    # Option 1: Use complete URL
    url: jdbc:mysql://your-db-host:your-db-port/your-db-name?useSSL=false&serverTimezone=America/Lima
    
    # Option 2: Or use environment variables (recommended)
    # host: your-db-host (default: localhost)
    # port: your-db-port (default: 3306)
    # name: your-db-name (default: cinerama_db)
    
    username: your-db-user
    password: your-db-password

  mail:
    username: your.email@gmail.com
    password: your-gmail-app-password

jwt:
  secret: your-jwt-secret-key
  expiration: your-jwt-expiration-time

paypal:
    client-id: your-paypal-client-id
    client-secret: your-paypal-client-secret
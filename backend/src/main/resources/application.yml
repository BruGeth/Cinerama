server:
  port: ${SERVER_PORT}

spring:
  application:
    name: backend

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
logging:
  level:
    org.springframework: INFO
    com.cinerama: DEBUG

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: sandbox
  api-url: https://api-m.sandbox.paypal.com
management:
    endpoints:
      web:
        exposure:
          include: health, info, prometheus
    endpoint:
      prometheus:
        enabled: true
    metrics:
      web:
        server:
          auto-time-requests: true
metrics:
    export:
      prometheus:
        enabled: true

# Development profile configuration - ALL values from environment variables
# This profile is for team development environment
# Use this profile: spring.profiles.active=dev

server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

  jpa:
    hibernate:
      # Use 'validate' in dev to prevent accidental schema changes
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: ${PAYPAL_MODE:sandbox}

tmdb:
  api-key: ${TMDB_API_KEY}

cors:
  # Development environment should include all possible origins
  # Example: http://localhost:3000,http://dev-server:3000,exp://10.0.2.15:8081
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: ${CORS_ALLOWED_METHODS}
  allowed-headers: ${CORS_ALLOWED_HEADERS}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS}
  max-age: ${CORS_MAX_AGE}

logging:
  level:
    '[org.springframework]': ${LOG_LEVEL_SPRING:INFO}
    '[com.cinerama]': ${LOG_LEVEL_APP:DEBUG}
  file:
    name: ${LOG_FILE_PATH:logs/cinerama-dev.log}
